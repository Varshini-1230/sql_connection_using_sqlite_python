<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Registration</title>
    <style>
        h1 {
            color:blue;
            background-color:beige

        }
        h3{
            font-style: italic;
            color:darkorange

        }
        body{
            color:black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: medium;
            padding:50px;
            line-height: 40px;


        }
    </style>
</head>
<body>
    <h1>Welcome to Resume Builder</h1>
    <h3>Let's begin with your basic details</h3>
    <div class="form-container">
        <div class="form-group">
            <label for ="firstname">First Name</label>
            <input type ="text" id="firstname" name="first name" placeholder="Enter First Name">
        </div>
            
        <div>
            <label for ='lastname'>Last Name</label>
            <input type="text" id="lastname" name="last name" placeholder="Enter last Name">
        </div>
        <div>
            <label for ="email">Email</label>
            <input type ="email" id="email" name="email" placeholder="abc@gmail.com">
        </div>
        <div>
            <label for="contact">Contact</label>
            <input type="number" id="contact" name="contact" placeholder="+91XXXXXXXXXX">
        </div>
        <div>
            <label for ="linkedin">Linkedin URL</label>
            <input type ="linkedin" id ="linkedin" name="linkedin" placeholder="Enter linkedin URL">
        </div>
        <div>
            <label for ="github">GitHub URL</label>
            <input type ="text" id ="github" name="github" placeholder="Enter GitHub URL">
        </div>
        <div>
            <label for ="coding">Coding Profile</label>
            <input type="'text" id ="coding" name="coding" placeholder="Enter Coding profile URL">
        </div>
        <button type ="submit" id="submit" > Submit </button>
        <button type="back" id="back">Back</button>
    </div>
    <script>
        let back=document.getElementById("back")  
        let submit=document.getElementById("submit");

        back.addEventListener("click",function(){
            alert("moving Back")
        });


        submit.addEventListener("click",function(){
            let firstname=document.getElementById("firstname").value;
            let lastname=document.getElementById("lastname").value;
            let email=document.getElementById("email").value;
            let contact=document.getElementById("contact").value;
            let linkedin=document.getElementById("linkedin").value;
            let github=document.getElementById("github").value;
            let coding=document.getElementById("coding").value;
        

            if (firstname===""){
                alert("Name should not be empty")
                return;
            }
            if (lastname===""){
                alert("Last nameshould not be empty")
                return;
            }
            if (!email.endsWith("@gmail.com")){
                alert("enter valid email")
                return;
            

            }
            if (!contact.length==13){
                alert('Add +91 before contact number')
            }else if (contact.length==10){
                alert('contact must be 10 numbers')
                return;
            }
            if (!linkedin.includes(".com")){
                alert("Enter valid linkedin Id")
                return;

            }
            if (!github.includes(".com")){
                alert("enter valid Github URL")
                return;
            }
            if (!coding.includes(".com")){
                alert("enter valid coding profile")
                return;
            }
        });

    </script>
</body>
</html>
